# dsh-better-sidebar-left bundle patch: five session plugins, ONE row in the plugin list.
#
# Self-contained: the plugin list shows exactly this package. The five components
# are ordinary packages this plugin composes, not profile bundles, so they have no
# rows of their own and never appear in that list.
#
# Seven rows are inserted here:
#
#   1. this package's own row. Its name is the BARE package name on purpose: the
#      client-module scanner treats an exact package specifier as a package and
#      resolves <name>/package.json for the dsh.client declaration. That is the
#      row the single browser bundle (src/client.js, which carries this plugin's
#      own half and all five vendored component factories) is served for.
#
#   2-7. one row per component, named <this package>/<suffix>. Every one of
#      those names resolves through package.json exports to src/shell.js, and the
#      shell mounts the component package named in config.plugin. Two properties
#      ride on that name, both load-bearing:
#
#        * the plugin list is a deduplicated set of package identities, and a
#          subpath of this package resolves to this package's identity - so the
#          five extra rows cost exactly zero extra rows in that list;
#        * the client-module scanner accepts only an exact package specifier, so a
#          subpath row never becomes a second browser source. The components'
#          browser halves keep travelling inside this package's bundle, and the
#          scanner's negative verdict for these specifiers is what keeps the boot
#          graph from growing a second entry per component.
#
# Both halves of every component are vendored into this package (tools/vendor.mjs),
# so installing it installs nothing else: the profile needs exactly one package and
# the five component packages do not have to be present at all. src/shell.js mounts
# src/vendor/host/<id>.js, never the component package.
#
# That is also why a component's fix reaches this package only through a re-vendor
# and a release - the copy here is the copy that runs. A component package that is
# missing, outdated or newer changes nothing about what runs.
#
# A row that fails to start is not fatal: it fails on its own (the Loader reports the
# reason and the other entries still start), and /api/dsh-better-sidebar-left/status
# reports hostMounted: false with that reason - which is also what keeps its buttons
# off the page.
- insert:
    - id: dsh-better-sidebar-left
      name: 'dsh-better-sidebar-left'
- insert:
    - id: dsh-better-sidebar-left-delete
      name: 'dsh-better-sidebar-left/delete'
      config:
        plugin: 'dsh-delete-session'
- insert:
    - id: dsh-better-sidebar-left-relocate
      name: 'dsh-better-sidebar-left/relocate'
      config:
        plugin: 'dsh-session-relocate'
- insert:
    - id: dsh-better-sidebar-left-rename
      name: 'dsh-better-sidebar-left/rename'
      config:
        plugin: 'dsh-session-rename-dblclick'
- insert:
    - id: dsh-better-sidebar-left-counts
      name: 'dsh-better-sidebar-left/counts'
      config:
        plugin: 'dsh-session-counts'
- insert:
    - id: dsh-better-sidebar-left-declutter
      name: 'dsh-better-sidebar-left/declutter'
      config:
        plugin: 'dsh-declutter'
- insert:
    - id: dsh-better-sidebar-left-launcher
      name: 'dsh-better-sidebar-left/launcher'
      config:
        plugin: 'dsh-settings-launcher'
